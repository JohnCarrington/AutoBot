# AutoBot's news table: which releases are BIG, MEDIUM or SMALL.
#
# The owner's own table, as set on AutoBot 161 from their research into how far
# GBPUSD moved around each release. Copied as DATA from the public audit report
# JohnCarrington/autobot_reports: news_impact_table_161.csv (78 rows, override
# table version 2026-08-14.v1, snapshot 2026-11-07) and its README. 161's code
# was not copied. Added for AutoBot (marked below): "gbp_interest_rate" and
# "gbp_unemployment_rate" (big), and three USD releases placed as small.
#
# HOW A RELEASE IS MATCHED (news/table.py; docs/SETTINGS.md "News table"):
#   * Only releases Finnhub marks with an impact in news.table_impacts (high)
#     are matched, as on 161. Every other release is SMALL.
#   * Its name is lower-cased. Rows are tried in this order: every [[override]]
#     row (only for its own currency), then every [[big]] row, then every
#     [[middle]] row (any currency). The first row that matches decides.
#   * A row matches when every text in "all_of" appears in the name (in any
#     order), or, for a "name_is" row, when the name is exactly that text.
#   * A row with "same_day" matches only if another release of the same
#     currency on the same UTC day matches one of its keyword groups.
#   * No row matches: SMALL (logged once, so the owner can place it). An
#     override may also say small: a release the owner has placed as small.
#   * Only BIG releases stop trading (design section 6); MEDIUM and SMALL are
#     ignored.
# Each row is one keyword group; a rule with several groups has several rows.


# ---- OVERRIDES: checked first; each only for its own currency ---------------------

[[override]]
# Added for AutoBot (owner, 7 November 2026): Finnhub sometimes names the Bank of
# England rate decision just "Interest Rate" (it did on 5 November 2026).
rule = "gbp_interest_rate"
currency = "GBP"
tier = "big"
name_is = "Interest Rate"

