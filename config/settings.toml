# AutoBot settings. Every number the bot uses lives here.
# Every setting must be described in docs/SETTINGS.md (a test checks this).
# Times are UK time (Europe/London: GMT in winter, BST in summer), written "HH:MM".
# One exception: the session times under [levels] are UTC (levels.sessions_time_zone).

[account]
account_type = "demo"

[prices]
candle_timeframes = ["tick", "5m", "1h", "4h", "1d", "1w"]

[trade]
size_gbp_per_pip = 10
# The stop loss (6 pips) and take profit sent to IG (100 pips) are switches in
# .env: STOP_LOSS_PIPS and TAKE_PROFIT_PIPS (config/switches.py).

[hours]
# The trading hours themselves (new trades from 06:00 until 20:30) are switches
# in .env: NEW_TRADES_FROM and NEW_TRADES_UNTIL (config/switches.py).
timezone = "Europe/London"
close_all_trades_at = "20:30"
hold_overnight = false

[news]
big_news_no_new_trades_before_minutes = 15
big_news_no_new_trades_after_minutes = 30
big_news_close_trades_before_minutes = 15
ignore_medium_and_small_news = true
# The economic calendar comes from Finnhub (news/; docs/NEWS.md). The API key is
# a secret in .env (FINNHUB_API_KEY): never printed, logged or committed.
finnhub_url = "https://finnhub.io/api/v1"
request_timeout_seconds = 20
# Fetch the calendar again once the copy on disk is this many hours old ...
refresh_hours = 6
# ... and after a failed fetch, wait at least this long before trying again.
retry_minutes = 60
# Each fetch covers this many days back and ahead of today (UTC).
fetch_days_back = 7
fetch_days_ahead = 14
# Releases older than this many days are dropped from the copy on disk.
keep_days = 90
# The calendar is OUT OF DATE (a Telegram problem alert; trading is not blocked
# by it) when the last good fetch is older than this many hours.
out_of_date_hours = 24
# The price service looks at the copy on disk this often (it fetches only when
# refresh_hours or retry_minutes say so) ...
check_minutes = 5
# ... and sends the calendar problem alert (missing, out of date, no key) at
# most this often while the problem lasts.
alert_every_hours = 6
# Where the copy of the calendar is kept (data/, not in git).
folder = "/opt/autobot/data/news"
# Big, medium and small news: AutoBot's news table, config/news_table.toml (the
# owner's table from AutoBot 161). As on 161, it is applied only to releases
# Finnhub marks with one of these impacts; every other release is small.
table_impacts = ["high"]
# Expected direction (design section 2.4): the forecast against the previous
# figure. For most releases a higher figure is good for the currency; for these
# (matched by name) a lower figure is good.
lower_is_better = ["Unemployment Rate", "Jobless Claims", "Claimant Count Change"]
# Finnhub country code -> currency.
country_currencies = ["GB=GBP", "UK=GBP", "US=USD", "EU=EUR", "EMU=EUR", "JP=JPY", "CH=CHF", "CA=CAD", "AU=AUD", "NZ=NZD"]

[limits]
max_open_trades_per_strategy = 1
bollinger_bounce_extra_opposite_direction_trades = 1
# Most trades open at once (design 6: 5), not counting the EMA pullback's.
max_open_trades = 5

[orders]
# The order sender (design 7). Every order, confirmation, refusal and close is recorded in
# folder/<PAIR>/orders.jsonl, and the open trades are rebuilt from it after a restart.
folder = "/opt/autobot/data/orders"
# IG's order fields for a spread bet: the expiry (daily funded bet) and the currency.
expiry = "DFB"
currency = "GBP"
# Each deal reference the bot makes starts with this (letters only); IG allows 30 characters.
deal_reference_prefix = "AB"
# When IG times out or its answer is unclear, how many times to check with IG (the deal
# reference, then the open positions) before giving up, and the wait between checks. The
# order is never sent again. STARTING VALUES.
unclear_checks = 3
unclear_check_wait_seconds = 2
# IG's confirmation of a new order or a close (GET /confirms/{reference}) is asked for up to this
# many times, this many seconds apart, while IG answers 404 (not there yet): as AutoBot 161.
confirm_attempts = 5
confirm_wait_seconds = 1
# A close IG refuses (or does not answer clearly) leaves the trade open; the trade manager tries the
# close again after this many seconds, for as long as the position is open at IG.
close_retry_seconds = 30

[trade_manager]
# Where the trade manager records every decision it makes (design 4).
folder = "/opt/autobot/data/trade_manager"

[records]
# Every trade and every decision, kept for good, with the daily and weekly summaries (design 9):
# folder/<PAIR>/ (paper trades in folder/<PAIR>/paper/).
folder = "/opt/autobot/data/records"

[trading]
# The daily summary (written, and sent on Telegram) each weekday at this UK time (owner, 8 November 2026).
daily_summary_at = "20:35"
# The pause switch (design 9): while this file exists, no new trade is sent; open trades are still run.
# The dashboard will create and remove it.
pause_file = "/opt/autobot/data/control/pause_new_trades"

[dashboard]
# The dashboard (design 9; hosted as AutoBot 161's): nginx on this server's Tailscale address, port 3000
# (deploy/autobot-dashboard.nginx), in front of the dashboard's data service on 127.0.0.1 at this port.
port = 8766
# The signed session cookie lasts this many days (as 161).
session_days = 30
# More wrong passwords than this in a minute and logging in is refused for the rest of that minute.
login_failures_per_minute = 5
# The price service writes the trading engine's status for the dashboard here (folder/<PAIR>/status.json)
# every status_every_seconds; the dashboard warns when it is older than status_stale_seconds.
status_folder = "/opt/autobot/data/trading"
status_every_seconds = 5
status_stale_seconds = 30

[safety]
# Total risk across all open trades (each trade's stop distance x its size), at most this
# (owner, 8 November 2026: set so it is never reached).
max_total_risk_gbp = 100000
# A new trade needs the account's available funds (IG's account details, read at start-up and
# whenever a trade opens or closes) to be at least the margin for one trade at £10 a pip
# (owner, 8 November 2026).
margin_per_trade_gbp = 5000
# IG's reasons (deal confirmation) for refusing a trade because of its stop, and for lack of
# funds (design 7). STARTING VALUES: to be confirmed against IG when the order sender is built.
ig_stop_refusal_reasons = ["ATTACHED_ORDER_LEVEL_ERROR"]
ig_funds_refusal_reasons = ["INSUFFICIENT_FUNDS"]
# Where the bot records IG's minimum stop distance each time IG refuses a trade because of its stop.
folder = "/opt/autobot/data/safety"
# One view at a time (design 6; owner, 9 November 2026): on the Monday after a Friday whose daily
# candle (sell price, open to close) moved at least this many pips, no reversal trade against the
# direction that reclaims Friday's move. 80 is the value tested in docs/research/one_view_20261109.md.
big_friday_move_pips = 80

[chart]
# The price every level and indicator is worked out from, to match the owner's
# IG chart, which is set to the sell (bid) price. Daily candles run midnight to
# midnight UK ([candles] day_starts_at). Trades still open and close at IG's
# real buy or sell price as normal.
price = "sell"

[levels]
# Every level uses the chart price ([chart] price: sell).
line_up_within_pips = 5
turning_levels_lookback_weeks = 2
# Where the current list of levels is written for the rest of the bot to read.
folder = "/opt/autobot/data/levels"
# Levels are written to this many decimal places of a point (IG shows 1).
level_decimals = 1
# Round numbers: every price ending in 00 and 50 pips ...
round_number_every_pips = 50
# ... within this many pips above or below the latest price. STARTING VALUE.
round_numbers_within_pips = 150
# Session highs and lows. These times are in UTC (not UK time), as given by
# the owner. STARTING VALUES, from AutoBot 161, for the owner to confirm.
sessions_time_zone = "UTC"
london_session_from = "07:00"
london_session_until = "12:00"
new_york_session_from = "12:00"
new_york_session_until = "21:00"
# Turning levels on the hourly chart (rule in docs/LEVELS.md). STARTING VALUES.
# A high (low) must be above (below) this many hourly candles on each side ...
turning_candles_each_side = 3
# ... and price must then move at least this many pips away from it ...
turning_min_move_pips = 20
# ... within this many hourly candles after it.
turning_move_within_candles = 6

[reversal_watch]
times = ["10:00", "11:00", "13:00", "14:00", "16:00", "17:00"]
minutes_before = 20
minutes_after = 20

[bounce]
reversal_candle_within_candles_of_pierce = 3
confirmation_candle_within_candles_of_reversal = 3
# The share of a Bollinger bounce trade closed when price reaches the opposite band; the rest goes on to its
# normal exits (owner, 11 November 2026: 50, as tested in docs/research/management_and_targets_20261111.md).
# 0 (no close at the band), 50 or 100: the order sender closes in full or by half only.
close_percent_at_opposite_band = 50
# The pace and target rule (owner, 11 November 2026, as tested in docs/research/pace_and_target_20261111.md:
# "within 5 pips, under 5 pips an hour over the last 2 hours"). While the bot has open trend trades (EMA pullback,
# slow grind, breakout), a Bollinger bounce against them opens only at a significant level in their direction
# (a 00, the weekly pivot, S2, S3, R2 or R3), with the high or low it turned from within
# against_trend_level_within_pips of it, and only if price has moved under against_trend_max_pips_per_hour on
# average over the last against_trend_pace_hours. It then closes every open trade in the opposite direction.
# Otherwise it is refused and the trend trades are held.
against_trend_level_within_pips = 5
against_trend_max_pips_per_hour = 5
against_trend_pace_hours = 2

[slow_grind]
# Design 3.1 (owner, 8 November 2026: result 13 of the slow grind research, holding rule 2).
min_pause_candles = 2
# The EMA a pause must stay under (over, for a buy); a close beyond it cancels (design 3.1).
ema_periods = 21
# Its own stop loss and take profit, sent to IG (design 4). On a UK day with big news for the
# pair the take profit is TAKE_PROFIT_PIPS (100) in .env instead.
stop_loss_pips = 15
take_profit_pips = 20
# Profit lock (design 4): once a trade has been lock_from_pips in profit, it is closed if price
# comes back to lock_at_pips in profit.
lock_from_pips = 15
lock_at_pips = 10
# No new slow grind trade in the first this many minutes after the week opens (Sunday), nor
# from rollover_no_new_trades_from to rollover_no_new_trades_until UK (design 6). Also none from
# hours.close_all_trades_at (20:30) to midnight UK.
week_open_no_new_trades_minutes = 15
rollover_no_new_trades_from = "21:55"
rollover_no_new_trades_until = "22:15"

[ema_pullback]
# The EMA pullback's own take profit, sent to IG (owner, 7 November 2026; every other
# strategy uses TAKE_PROFIT_PIPS in .env).
take_profit_pips = 30
setup_expires_after_minutes = 20
entry_beyond_pips = 3
entry_lookback_candles = 5
# The 5-minute EMAs (design 3.2): the pullback reaches the fast one; a close
# beyond the slow one cancels.
fast_ema_periods = 8
mid_ema_periods = 13
slow_ema_periods = 21
# Step 0, the hourly trend (design 3.2: "hourly 8, 13 and 20 EMAs in order and
# all rising, with the slope and gap minimums from 161's service"). From AutoBot
# 161's EMA pullback service (audit ema_pullback_audit_for_new_bot_20261106.md,
# trend.py): EMAs 8/13/20 in order and each rising on the last hourly candle;
# each EMA's slope over the last 3 hourly candles in the trend's direction and at
# least 0.16 pips an hour (161: "the right sign and absolute magnitude");
# the 8 and 13 EMAs at least 0.25 pips apart, the 13 and 20 at least 0.20.
hourly_fast_ema_periods = 8
hourly_mid_ema_periods = 13
hourly_slow_ema_periods = 20
hourly_slope_candles = 3
hourly_min_slope_pips_per_hour = 0.16
hourly_min_gap_fast_mid_pips = 0.25
hourly_min_gap_mid_slow_pips = 0.20
# Stored hourly candles read to work out the hourly EMAs.
hourly_history_candles = 600
# No new EMA pullback trade from rollover_no_new_trades_from to rollover_no_new_trades_until UK:
# IG's spread jumps to about 17 pips at the 22:00 rollover, so a trade opened then is stopped at
# once (owner, 13 November 2026; the slow grind's window, design 6).
rollover_no_new_trades_from = "21:55"
rollover_no_new_trades_until = "22:15"

[possible_reversal]
min_trend_move_pips = 30

[breakout]
# Design 3.5 (owner, 7 November 2026). The breakout candle's high (buy) or low
# (sell) must be broken within this many candles after it, or the setup expires.
trigger_within_candles = 3
# Its stop loss and take profit in pips (owner, 7 November 2026; the stop 12 from
# 10 November 2026, with the bounce and range trade's STOP_LOSS_PIPS). 0 would mean
# "not chosen": the bot refuses to start with STRATEGY_BREAKOUT on while either is 0.
stop_loss_pips = 12
take_profit_pips = 50

[level_reversal]
# Design 3.6 (owner, 8 November 2026). Rejections at these levels only (the bot's level
# types): S2, R2 and round numbers, the round numbers only on a multiple of
# round_numbers_every_pips (100: the 00s, not the 50s).
level_types = ["S2", "R2", "round_number"]
round_numbers_every_pips = 100
# A rejection counts only if price went no more than this far past the level, from the
# piercing candle to the confirmation candle: one allowance for each kind of level
# (owner, 8 November 2026: 12 at R2 and S2, 5 at round numbers).
allowance_pips_r2 = 12
allowance_pips_s2 = 12
allowance_pips_round_number = 5
# The stop: this many pips beyond the furthest point price reached; the take profit, in
# pips from the entry.
stop_beyond_furthest_pips = 6
take_profit_pips = 20

[range_trade]
# The share of a range trade closed when price reaches the opposite band (owner, 11 November 2026: 100, in
# full, as tested in docs/research/management_and_targets_20261111.md; 50 before). 50 or 100.
close_percent_at_opposite_band = 100
# The rejection candle must be the candle straight after the one that pierced
# the band (1 = the next candle) ...
rejection_candle_within_candles = 1
# ... and the trigger must come during the candle after that (1 = that candle only).
trigger_within_candles = 1

[indicators]
# Bollinger bands, as on the owner's IG chart: 20 periods, 2 standard deviations,
# on the chart price ([chart] price).
bollinger_periods = 20
bollinger_std_devs = 2
# EMAs, as on the owner's IG chart: 7, 13 and 21 (trend: slope and fanning) and
# 100 and 200, on the chart price. Each starts from the simple average of its
# first candles, then the usual EMA (weight 2 / (periods + 1)).
ema_periods = [7, 13, 21, 100, 200]
# MACD, as on the owner's IG chart: 35, 45, 30. MACD line = fast EMA - slow EMA;
# signal line = EMA of the MACD line; histogram = MACD line - signal line.
macd_fast_periods = 35
macd_slow_periods = 45
macd_signal_periods = 30
# RSI, as on the owner's IG chart: 3 periods, with lines at 70 and 30
# (Wilder's smoothing, the usual RSI).
rsi_periods = 3
rsi_upper_line = 70
rsi_lower_line = 30
# The candle sizes the indicators are worked out on (design section 2.8).
timeframes = ["5m", "1h"]
# How many stored candles, up to the time asked about, are read to work them out.
history_candles = 2000
# An EMA, MACD or RSI starts from a guess (a simple average). It counts as READY
# once that guess makes up no more than this percent of its value; until then
# it is "warming up". STARTING VALUE (docs/ANALYSER.md).
warm_up_seed_weight_percent = 2

[analyser]
# Direction rule (design section 2.3): buy side when price is above the daily
# pivot and above this EMA; sell side when below both; otherwise no clear direction.
direction_ema_timeframe = "5m"
direction_ema_periods = 100
# While the market is open, the data is OUT OF DATE when the newest stored
# candle of an indicator timeframe is more than this many minutes behind the
# newest one that should have finished. STARTING VALUE.
out_of_date_after_minutes = 10

[trend_day]
# The trend-day check (design 2.4; owner, 8 November 2026): at the day's 00:00 UK open, a trend
# day downwards when the open is at or above the previous month's level_above and the daily RSI
# (rsi_periods) at the previous day's close is above rsi_above; upwards when at or below
# level_below and the RSI is below rsi_below. Monthly levels from the daily candles.
level_above = "R2"
level_below = "S2"
rsi_periods = 14
rsi_above = 70
rsi_below = 30
# Daily candles read to work out the RSI (all the store holds, up to this many).
rsi_history_candles = 1000

[market_states]
# The analyser's five market states (design section 2; docs/ANALYSER.md).
# Worked out on the 5-minute candles, sell price. "161" = AutoBot 161's NMS
# value (audit nms_audit_for_new_bot_20261106.md); "new" = a starting value
# for Johnny to check against real days (161 had none).
# Consolidation: the Bollinger bands count as narrow when at most this many pips
# apart, OR when they have narrowed on each of the last narrowing_candles candles.
# Owner's values, 7 November 2026 (they replaced 161's CHOP_BB_WIDTH_MAX_PIPS 8.0).
narrow_band_max_pips = 14
narrowing_candles = 6
# Flat: the middle band moves less than this many pips a candle, over the
# number of candles below. 161: CHOP_SLOPE_MAX_PIPS_PER_BAR 0.5, CHOP_SLOPE_LOOKBACK 6
flat_max_pips_per_candle = 0.5
flat_slope_candles = 6
# Ranging (design 2.2; owner's values, 7 November 2026): "the Bollinger bands
# are flat and close together": the band width at least ranging_min_band_pips
# and at most ranging_max_band_pips, and the upper and the lower band each
# moving less than ranging_band_flat_max_pips_per_candle a candle (over
# flat_slope_candles) ...
ranging_min_band_pips = 6
ranging_max_band_pips = 18
ranging_band_flat_max_pips_per_candle = 0.2
# ... price has reached both bands within this many candles (new) ...
ranging_both_bands_candles = 24
# ... the EMAs 7/13/21 have changed order at least once within this many candles (new) ...
weave_candles = 12
# ... and the 100 EMA has moved less than this many pips over this many candles (new).
ema100_flat_max_pips = 3
ema100_flat_candles = 12
# Consolidation: no candle has closed outside the bands for this many candles
# (owner's rule, 7 November 2026; also the window for the next two checks),
# average body at most this many pips (new), and green and red bodies within
# this ratio of each other (new: 2 means one side at most twice the other).
consolidation_quiet_candles = 6
consolidation_max_body_pips = 3
consolidation_colour_max_ratio = 2
# "On or near" a band: within this many pips of it (new).
near_band_pips = 1
# A condition must hold for this many candles in a row before the state
# changes (flip-flop protection). 161: PERSISTENCE_BARS 2
persistence_candles = 2
# Evidence fades: an emerging trend or a possible reversal with nothing new
# for this many candles ends. 161: EVIDENCE_TTL_BARS 24 (120 minutes)
evidence_fades_after_candles = 24
# EMAs 7/13/21 count as stacked once in order for this many candles. 161: rule E7, 3 bars
ema_stacked_candles = 3
# A failed bounce: its high (low, for an uptrend) at or within this many pips
# above the higher of the 21 EMA and the middle band (new).
failed_bounce_within_pips = 1
# Strong push, over this many candles (new): at least this percent of the total
# candle body size in the trend's colour (owner's rule, 7 November 2026: by body
# size, so a few big red candles with small green ones between still count), the band at least this percent of its width this many
# candles before, the 7 and 21 EMAs at least this many pips apart, and at least
# this many closes on or beyond the outer band.
push_candles = 6
push_colour_body_percent = 70
push_band_widening_percent = 150
band_widening_candles = 12
push_ema_fan_pips = 6
push_riding_band_closes = 3
# A big spike: a candle's high-low range more than this many times the average
# of the last spike_average_candles (new).
spike_range_multiple = 3
spike_average_candles = 20
# The 5-minute candles read before the week's open to start the indicators from.
indicator_warm_up_candles = 2000
# Where every state change is recorded (one file per pair).
folder = "/opt/autobot/data/analyser"
# The levels a rejection must be at to START or REPLACE an emerging trend
# (owner's rule, 7 November 2026). A turning level counts only when it lines up
# with one of these. Round numbers are every 00 and 50.
strong_level_types = ["pivot", "R1", "R2", "R3", "S1", "S2", "S3", "round_number", "previous_day_high", "previous_day_low"]

[rejection]
# The candle size the shared rejection part watches.
candle_timeframe = "5m"
# A candle that comes within this many pips of a level counts the same as a
# pierce of it (levels only: the Bollinger band needs a real pierce).
near_level_within_pips = 3
# When IG's spread on a candle (the widest buy-minus-sell gap of its open, high,
# low and close) is over this many pips, that candle's highs and lows cannot
# start or cancel a setup. Normal is 0.9 to 1.5; the 22:00 rollover and news
# reach 4 to 26. STARTING VALUE (docs/REJECTION.md).
max_spread_pips = 3

[ig]
demo_base_url = "https://demo-api.ig.com/gateway/deal"
slowed_down_waits_seconds = [60, 90, 120, 180]
request_timeout_seconds = 30

# Every currency pair the bot knows (config/pairs.py). Which ones are switched
# on is in .env (PAIRS_ON). Each pair has its own candle store
# (<candles folder>/<PAIR>/) and levels (<levels folder>/<PAIR>/); the history
# door's budget and IG's history allowance are shared by all pairs.
#   epic         IG's market for the pair on the spread bet account
#   pip_size     one pip in the real price, in quotes (0.0001; JPY pairs 0.01)
#   price_scale  IG's price = real price x this
# One pip is pip_size x price_scale of IG's points.
[pairs.GBPUSD]
# Found with one market search (GET /markets?searchTerm=GBPUSD) on 6 November
# 2026: "GBP/USD", expiry DFB. IG sends 13354.4 for 1.33544, so one pip
# (0.0001) is 1 point.
epic = "CS.D.GBPUSD.TODAY.IP"
pip_size = "0.0001"
price_scale = 10000

[market_hours]
# IG's trading hours for GBPUSD. Set from two sources (docs/SETTINGS.md):
# 1. IG Help Centre, "Forex spread betting product details", note 1: "Normal
#    dealing hours for all pairs are from 21.00 (London time) on Sunday until
#    21.59 (London time) on Friday" (written in summer time), with the warning
#    that clock changes "may cause the times shown to be imprecise".
# 2. IG's own 5-minute candles from the one-off fill (25 Oct - 6 Nov 2026):
#    opened Sun 25 Oct 21:00 GMT (17:00 New York) and Sun 1 Nov 21:00 GMT
#    (16:00 New York), so the OPEN follows UK time; closed Fri 30 Oct at
#    21:00 GMT = 17:00 New York (US still on summer time), so the CLOSE
#    follows New York time.
# So: opens Sunday 21:00 UK time; closes Friday 17:00 New York time (22:00 UK
# most of the year, 21:00 UK when US clocks are on summer time and UK's are not).
opens_day = "Sunday"
opens_at = "21:00"
opens_time_zone = "Europe/London"
closes_day = "Friday"
closes_at = "17:00"
closes_time_zone = "America/New_York"

[stream]
# Waits before each reconnect after the price stream drops, in order. After
# the last one, every further wait is the last value.
reconnect_waits_seconds = [5, 10, 20, 40, 80, 160, 300]
# Warn if no prices arrive for this long while the market is open.
no_prices_warning_seconds = 120
# Once the stream has stayed connected this long, the reconnect waits start
# again from the first one, and one more controlled re-login is allowed.
healthy_after_minutes = 60
# When running as a service, write a short status line (ticks, candles stored,
# connection) to the log this often.
status_log_minutes = 60

[candles]
folder = "/opt/autobot/data/candles"
# 1-hour candles start at this minute past each hour.
hour_starts_at_minute = 0
# 4-hour candles start at this time and every 4 hours after it.
four_hour_starts_at = "00:00"
# Daily candles start (and end) at this UK time. Midnight, to match IG's own
# daily candles (checked against IG's daily candles from the one-off fill).
day_starts_at = "00:00"
# Weekly candles start on this day at day_starts_at.
week_starts_day = "Sunday"
# false: like IG, a candle keeps its normal boundary label even when the market
# opens later (IG's short Sunday daily candle is labelled 00:00 and holds 21:00
# to midnight). true: that stretch is joined onto the next candle instead.
join_opening_stretch = false
# A 1-hour, 4-hour, daily or weekly candle missing some 5-minute candles is
# built only after waiting this long past its end for a late one.
wait_for_late_candle_seconds = 300
# Candle files older than this many days are compressed (never deleted).
compress_after_days = 30

[housekeeping]
log_folder = "/opt/autobot/logs"
log_max_file_mb = 10
log_new_file_every_hours = 24
log_keep_files = 20
log_max_age_days = 30
min_free_disk_mb = 2048

[history]
# The ONLY door to IG's historical prices is ig/history.py. These are its limits.
folder = "/opt/autobot/data/history"
# The bot's own budget: points it may use in any 7 days, for ALL pairs together
# (IG allows 10,000 a week for the account). Raised from 4000 to 7000 by the
# owner on 7 November 2026. It may not be set above 8000 (IG's 10,000 less the
# 2,000 floor below).
weekly_budget_points = 7000
# Refuse a request if IG's last reported remaining allowance, less the request,
# would fall below this.
min_ig_allowance_remaining = 2000
# The biggest request allowed, in points (one point = one candle).
max_points_per_request = 500
# After IG refuses a request because of the allowance, block every history
# request for at least this long (longer if IG's reset time is later).
min_block_hours = 24

[alerts]
# Telegram alerts (alerts/). The bot token and chat ID are secrets in .env
# (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID): never printed, logged or committed.
telegram_url = "https://api.telegram.org"
request_timeout_seconds = 15
# The same problem never sends more than one message in this many minutes
# (the ones held back are counted in the next message). Kept across restarts.
same_problem_every_minutes = 10
# Where the alerts part keeps what it has sent (for the limit and the ready messages).
folder = "/opt/autobot/data/alerts"
# Daily "ready" message, Monday to Friday, UK time ...
daily_ready_at = "06:00"
# ... sent at the first check at or after that time, but not if the price
# service only starts more than this many minutes later.
daily_ready_late_by_minutes = 60
# Sunday "ready" message: sent when every pair switched on has its first
# 5-minute candle of the week, if that is within this many minutes of the reopen;
# if a pair has none by then, a problem alert is sent instead.
sunday_ready_within_minutes = 30
# A pair's candles count as arriving if its newest 5-minute candle finished
# no more than this many minutes ago.
candles_arriving_within_minutes = 10

